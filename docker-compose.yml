# Production stack for mrfantastic.ir: postgres + game server + nginx (TLS, SPA, API, WS).
# Set POSTGRES_PASSWORD in .env — never commit the real password.

services:
  postgres:
    image: postgres:16-alpine
    container_name: secret-hitler-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secret_hitler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-secret_hitler}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: secret-hitler-server
    restart: unless-stopped
    # Host network so mediasoup RTP uses 40000–40999 without Docker mapping
    # a thousand UDP ports (that OOMs the VPS and leaves 443 dead).
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: '3001'
      DATABASE_URL: postgres://${POSTGRES_USER:-secret_hitler}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB:-secret_hitler}
      PUBLIC_URL: ${PUBLIC_URL:-https://mrfantastic.ir}
      FEATURE_PUBLIC_TABLE: ${FEATURE_PUBLIC_TABLE:-true}
      BALE_WEBHOOK_URL: ${BALE_WEBHOOK_URL:-https://mrfantastic.ir/api/bale/webhook}
      BALE_WEBHOOK_SECRET: ${BALE_WEBHOOK_SECRET:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-@secret_hitler_bot}
      BALE_SUPPORT_CHAT_ID: ${BALE_SUPPORT_CHAT_ID:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://mrfantastic.ir/api/telegram/webhook}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-@secret_hitler_bot}
      TELEGRAM_WEBAPP_SHORT_NAME: ${TELEGRAM_WEBAPP_SHORT_NAME:-game}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  turn:
    image: coturn/coturn:4.6
    container_name: secret-hitler-turn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-hitler}:${TURN_PASSWORD:-change-me}
      --realm=${PUBLIC_URL:-mrfantastic.ir}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: secret-hitler-nginx
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      # Old nginx images still proxy to hostname `server`.
      - 'server:host-gateway'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Put fullchain.pem and privkey.pem in ./ssl on the host.
      - ./ssl:/etc/nginx/ssl:ro
    # Do not wait for the game process — 443 should stay up if the API is down.

volumes:
  postgres-data:
