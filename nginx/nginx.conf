worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 4m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Mini-app must be iframe-able from Bale web. Do not set X-Frame-Options.
  # Hashed JS/CSS/audio/images can live forever; the document, worker, and
  # version probe must always revalidate or deploys sit behind an old worker.
  map $uri $asset_cache_control {
    ~*^/sw\.js$ "no-cache";
    ~*^/version\.json$ "no-cache";
    ~*\.(?:js|css|woff2|mp3|webp|png|jpe?g|svg)$ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  upstream game_server {
    # Game process is host-networked so mediasoup can bind UDP on the box.
    server host.docker.internal:3001;
  }

  server {
    listen 80;
    server_name mrfantastic.ir;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name mrfantastic.ir;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Content-Security-Policy "frame-src https://*.bale.ai" always;
    add_header Cache-Control $asset_cache_control always;

    location /health {
      proxy_pass http://game_server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      proxy_pass http://game_server;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
      proxy_pass http://game_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
