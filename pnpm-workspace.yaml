packages:
  - 'shared'
  - 'server'
  - 'client'
  - 'bale-bot'

# pnpm 11's default 24h age gate rejects lockfile entries published today
# (browserslist transitives) and aborts Docker --frozen-lockfile installs.
minimumReleaseAge: 0
minimumReleaseAgeStrict: false

# VPS Docker installs hit ECONNRESET against the npm registry when many
# tarballs are fetched in parallel.
networkConcurrency: 1
fetchTimeout: 100000

# Lifecycle scripts are blocked unless listed. esbuild/core-js ship native
# binaries via postinstall; strictDepBuilds would fail CI without this map.
strictDepBuilds: false
allowBuilds:
  esbuild: true
  core-js: true
  '@parcel/watcher': true
  mediasoup: true
