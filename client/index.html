<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]') return;
        // Phone on Wi-Fi uses a LAN IPv4; miniapp.js logs "invoice id is not
        // provided" outside the real Bale client, same as localhost.
        var parts = host.split('.');
        if (parts.length === 4) {
          var a = +parts[0];
          var b = +parts[1];
          if (a === 10 || a === 127 || (a === 192 && b === 168) || (a === 172 && b >= 16 && b <= 31)) return;
        }
        var hay = document.referrer || '';
        try {
          if (location.ancestorOrigins && location.ancestorOrigins.length) {
            hay += ' ' + Array.prototype.join.call(location.ancestorOrigins, ' ');
          }
        } catch (e) {}
        // Both SDKs parse the same tgWebAppData hash. Loading Telegram's
        // inside Bale fills Telegram.initData, and Telegram.BackButton
        // needs Bot API 6.1+ — Bale reports 1.x, so the native back is a no-op.
        var nativeBale = typeof BaleWebApp !== 'undefined';
        var nativeTelegram =
          typeof TelegramWebviewProxy !== 'undefined' ||
          (window.webkit &&
            window.webkit.messageHandlers &&
            window.webkit.messageHandlers.TelegramWebView);
        var parentBale = /bale\.ai/i.test(hay);
        var parentTelegram = /telegram\.(org|me)|telesco\.pe/i.test(hay);
        if ((nativeBale && !nativeTelegram) || (parentBale && !parentTelegram)) {
          document.write('<script src="https://tapi.bale.ai/miniapp.js?3"><\/script>');
          return;
        }
        if ((nativeTelegram && !nativeBale) || (parentTelegram && !parentBale)) {
          document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
          return;
        }
        document.write('<script src="https://tapi.bale.ai/miniapp.js?3"><\/script>');
        document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#051528" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self)" />
    <title>Secret Hitler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
